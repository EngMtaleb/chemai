[project]
name = "chemai"
version = "0.1.0"
description = "Reusable toolkit for chemical engineering AI projects"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "httpx>=0.26"]
sim = ["thermo>=0.2"]
viz = ["matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chemai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
