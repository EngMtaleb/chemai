[project]
name = "chemai"
version = "0.1.0"
description = "Reusable toolkit for chemical engineering AI projects"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    # Pickled estimators are only valid for the version that wrote them; the
    # service reports a mismatch through /health (chemai/models/serialize.py).
    "scikit-learn>=1.3,<2",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "httpx>=0.26"]
sim = ["thermo>=0.2"]
viz = ["matplotlib>=3.7"]
data = ["pyarrow>=14"]          # the Project 4 results are parquet files
ml = ["xgboost>=2.0", "lightgbm>=4.0", "torch>=2.2"]   # Project 6: the model ladder

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chemai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
