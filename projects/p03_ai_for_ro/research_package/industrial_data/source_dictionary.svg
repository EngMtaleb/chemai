<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565"><rect width="1200" height="565" rx="24" fill="#f4f9fc"/><g font-family="Arial,sans-serif" fill="#17364a"><text x="32" y="44" font-size="25" font-weight="700">Source dictionary · retain the published meaning</text><text x="32" y="75" font-size="16" fill="#567385">Verified Zenodo deposit: 1,340 train-days · 3 trains · 18 cleaning campaigns</text><text x="32" y="119" font-size="13" fill="#648093" font-weight="700">FIELD</text><text x="266" y="119" font-size="13" fill="#648093" font-weight="700">USED AS</text><text x="690" y="119" font-size="13" fill="#648093" font-weight="700">UNIT</text><text x="900" y="119" font-size="13" fill="#648093" font-weight="700">INTERPRETATION LIMIT</text><rect x="20" y="131" width="1160" height="47" rx="8" fill="#e9f2f7"/><text x="32" y="158" font-size="15" font-weight="700">dp_pct</text><text x="266" y="158" font-size="16" font-weight="400">Pressure-related deposited score</text><text x="690" y="158" font-size="16" font-weight="400">Dimensionless</text><text x="900" y="158" font-size="16" font-weight="400">Do not convert to bar</text><rect x="20" y="184" width="1160" height="47" rx="8" fill="#f4f9fc"/><text x="32" y="211" font-size="15" font-weight="700">flux_pct</text><text x="266" y="211" font-size="16" font-weight="400">Flux-related deposited score</text><text x="690" y="211" font-size="16" font-weight="400">Dimensionless</text><text x="900" y="211" font-size="16" font-weight="400">Not product flow in m³/h</text><rect x="20" y="237" width="1160" height="47" rx="8" fill="#e9f2f7"/><text x="32" y="264" font-size="15" font-weight="700">ndp_pct / sp_pct</text><text x="266" y="264" font-size="16" font-weight="400">Additional observed indicators</text><text x="690" y="264" font-size="16" font-weight="400">Dimensionless</text><text x="900" y="264" font-size="16" font-weight="400">No raw pressure / salinity</text><rect x="20" y="290" width="1160" height="47" rx="8" fill="#f4f9fc"/><text x="32" y="317" font-size="15" font-weight="700">day_index</text><text x="266" y="317" font-size="16" font-weight="400">Relative observation day</text><text x="690" y="317" font-size="16" font-weight="400">Days from day 0</text><text x="900" y="317" font-size="16" font-weight="400">No weather calendar alignment</text><rect x="20" y="343" width="1160" height="47" rx="8" fill="#e9f2f7"/><text x="32" y="370" font-size="15" font-weight="700">CIP ledger</text><text x="266" y="370" font-size="16" font-weight="400">Observed cleaning campaign dates</text><text x="690" y="370" font-size="16" font-weight="400">Relative day</text><text x="900" y="370" font-size="16" font-weight="400">Past known events only as input</text><rect x="20" y="396" width="1160" height="47" rx="8" fill="#f4f9fc"/><text x="32" y="423" font-size="15" font-weight="700">state / days_to_next_cip</text><text x="266" y="423" font-size="16" font-weight="400">Future-aware event metadata</text><text x="690" y="423" font-size="16" font-weight="400">Metadata</text><text x="900" y="423" font-size="16" font-weight="400">Excluded from predictors</text><rect x="24" y="467" width="1152" height="76" rx="12" fill="#fff0cb"/><text x="40" y="495" font-size="17" font-weight="700">Source ambiguity is preserved, not hidden.</text><text x="40" y="522" font-size="16">Dictionary and scripts differ on baseline/reset semantics; raw SCADA is withheld. No physical ΔP threshold is inferred.</text></g></svg>